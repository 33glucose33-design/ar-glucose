<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Быстрый AR: Крахмал в Сироп</title>
  
  <!-- Сверхбыстрые и легкие библиотеки AR без зависаний -->
  <script src="https://yastatic.net"></script>
  <script src="https://cloudflare.com"></script>
</head>
<body style="margin: 0; overflow: hidden; background: #000;">

  <!-- Быстрая AR-сцена. Сама включает камеру -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- 
      Используем встроенный неубиваемый маркер HIRO. 
      Он заменяет файл .mind, поэтому сайт загружается МГНОВЕННО.
    -->
    <a-marker preset="hiro">
      
      <!-- Разворачиваем потоки анимации горизонтально поверх вашего плаката -->
      
        
        <!-- ================= ТОЧКА 5: ЦЕНТР (ЯДРО) ================= -->
        <a-ring radius-inner="0" radius-outer="0.05" position="0 0 0.01" color="#ffd700"
                animation="property: scale; from: 1 1 1; to: 1.3 1.3 1.3; dur: 800; loop: true; dir: alternate">
        </a-ring>

        <!-- ================= ПОТОК КРАХМАЛА (Точка 8 → Точка 5) ================= -->
        <!-- Белые сферы летят справа (X: 0.5) строго в центр (X: 0) -->
        <a-sphere position="0.5 0 0.01" radius="0.015" color="#ffffff"
                  animation="property: position; from: 0.5 0 0.01; to: 0 0 0.01; dur: 1800; loop: true; easing: linear">
        </a-sphere>
        <a-sphere position="0.5 0.03 0.01" radius="0.01" color="#f0f4f8"
                  animation="property: position; from: 0.5 0.03 0.01; to: 0 0 0.01; dur: 1400; loop: true; easing: linear; delay: 400">
        </a-sphere>

        <!-- ================= ПОТОК СИРОПА (Точка 5 → Точка 2) ================= -->
        <!-- Золотые капли летят из центра (X: 0) строго налево (X: -0.5) -->
        <a-cylinder position="0 0 0.01" radius="0.015" height="0.06" color="#ffd700" rotation="0 0 90"
                    animation="property: position; from: 0 0 0.01; to: -0.5 0 0.01; dur: 2200; loop: true; easing: linear">
        </a-cylinder>
        <a-cylinder position="0 -0.02 0.01" radius="0.012" height="0.05" color="#ffaa00" rotation="0 0 90"
                    animation="property: position; from: 0 -0.02 0.01; to: -0.5 -0.02 0.01; dur: 1800; loop: true; easing: linear; delay: 500">
        </a-cylinder>

      

    </a-marker>

  </a-scene>

</body>
</html>
