<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Гидролиз: Крахмал и Сироп</title>
  
  <!-- Скрипт дополненной реальности -->
  <script src="https://jsdelivr.net"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }

    #ar-info {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(11, 12, 16, 0.85);
      border: 1px solid #45f3ff;
      padding: 12px 24px;
      border-radius: 20px;
      color: #45f3ff;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      z-index: 999;
      text-align: center;
      pointer-events: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    /* Холст, который привяжется к плакату */
    .ar-poster-canvas {
      position: absolute;
      display: none;
      background: transparent;
      box-sizing: border-box;
    }

    .ar-poster-canvas.target-tracked {
      display: block;
    }

    /* Точка 5 (Ядро) */
    .transformation-core {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, #ffffff 10%, #ffd700 70%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 35px #ffd700, 0 0 10px #fff;
      animation: pulseCore 1s ease-in-out infinite alternate;
      z-index: 5;
    }

    /* Крахмал: 8 → 5 */
    .starch-particle {
      position: absolute;
      top: 50%;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffffff;
      animation: flowStarch 2s linear infinite;
    }

    /* Сироп: 5 → 2 */
    .syrup-drop {
      position: absolute;
      top: 50%;
      background: linear-gradient(to left, #ffd700, #ff8c00);
      border-radius: 50% 15% 15% 50% / 50% 50% 50% 50%;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
      animation: flowSyrup 2.2s linear infinite;
    }

    .st1 { animation-delay: 0.0s; margin-top: -5px; width: 10px; height: 10px; }
    .st2 { animation-delay: 0.4s; margin-top: 5px;  width: 7px;  height: 7px; }
    .st3 { animation-delay: 0.8s; margin-top: -12px;width: 9px;  height: 9px; }
    .st4 { animation-delay: 1.2s; margin-top: 10px; width: 6px;  height: 6px; }

    .sy1 { animation-delay: 0.2s; margin-top: -6px; width: 20px; height: 12px; }
    .sy2 { animation-delay: 0.8s; margin-top: 4px;  width: 14px; height: 9px; }
    .sy3 { animation-delay: 1.4s; margin-top: -14px;width: 24px; height: 15px; }

    @keyframes flowStarch {
      0% { left: 94%; opacity: 0; transform: translate(0, -50%) scale(0.6); }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { left: 50%; opacity: 0.2; transform: translate(0, -50%) scale(1.1); }
    }

    @keyframes flowSyrup {
      0% { left: 50%; opacity: 0; transform: translate(0, -50%) scale(0.8); }
      15% { opacity: 1; transform: translate(0, -50%) scale(1.1); }
      85% { opacity: 1; }
      100% { left: 6%; opacity: 0; transform: translate(-20px, -50%) scale(0.5); }
    }

    @keyframes pulseCore {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    }

    /* Фикс видео для Хрома на Android */
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: -1;
    }
  </style>
</head>
<body>

  <div id="ar-info">Запуск камеры... Подождите</div>

  <div id="ar-container"></div>

  <div id="paintar-target" class="ar-poster-canvas">
    <div class="starch-particle st1"></div>
    <div class="starch-particle st2"></div>
    <div class="starch-particle st3"></div>
    <div class="starch-particle st4"></div>

    <div class="transformation-core"></div>

    <div class="syrup-drop sy1"></div>
    <div class="syrup-drop sy2"></div>
    <div class="syrup-drop sy3"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const infoBox = document.querySelector("#ar-info");
      const arCanvas = document.querySelector("#paintar-target");

      try {
        const mindarThree = new window.MINDAR.IMAGE.MindARImage({
          container: document.querySelector("#ar-container"),
          imageTargetSrc: "targets.mind"
        });

        const anchor = mindarThree.addAnchor(0);

        anchor.onTargetFound = () => {
          infoBox.innerText = "АР Плакат Ожил ✨";
          infoBox.style.borderColor = "#ffd700";
          infoBox.style.color = "#ffd700";
          arCanvas.classList.add("target-tracked");
        };

        anchor.onTargetReleased = () => {
          infoBox.innerText = "Наведите камеру на плакат";
          infoBox.style.borderColor = "#45f3ff";
          infoBox.style.color = "#45f3ff";
          arCanvas.classList.remove("target-tracked");
        };

        anchor.onTargetUpdate = (matrix) => {
          const projection = mindarThree.getProjectionMatrix();
          const width = mindarThree.imageTargets.width;
          const height = mindarThree.imageTargets.height;
          
          arCanvas.style.width = width + "px";
          arCanvas.style.height = height + "px";
          mindarThree.updateCSSObject(arCanvas, matrix, projection);
        };

        // Запуск AR
        await mindarThree.start();
        infoBox.innerText = "Наведите камеру на плакат";

      } catch (err) {
        console.error(err);
        infoBox.innerText = "Ошибка доступа к камере";
        infoBox.style.borderColor = "#ff4545";
        infoBox.style.color = "#ff4545";
      }
    });
  </script>

</body>
</html>
