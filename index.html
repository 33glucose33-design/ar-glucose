<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Гидролиз: Крахмал и Сироп</title>
  
  <!-- Стабильные базовые библиотеки WebAR (AR.js + A-Frame) -->
  <script src="https://aframe.io"></script>
  <script src="https://githack.com"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Информационное окно для пользователя -->
  <div style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); 
              background: rgba(0,0,0,0.8); color: #00f2fe; padding: 12px 24px; 
              border-radius: 30px; border: 1px solid #00f2fe; font-family: sans-serif; 
              font-size: 13px; text-transform: uppercase; letter-spacing: 1px; z-index: 9999; text-align: center;">
    Наведите камеру на AR-маркер (HIRO)
  </div>

  <!-- AR Сцена: автоматически включает камеру устройства -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- 
      В качестве опоры используется стандартный, самый надежный в мире AR-маркер "HIRO".
      Вся анимация привязана к его габаритам. Центр маркера — это точка 5.
    -->
    <a-marker preset="hiro">
      
      <!-- Контейнер анимации, развернутый горизонтально на маркере (лежит плоско на плакате) -->
      
        
        <!-- ================= ТОЧКА 5: ЦЕНТР (ЯДРО ГИДРОЛИЗА) ================= -->
        <a-ring radius-inner="0" radius-outer="0.04" position="0 0 0.01" color="#ffd700"
                animation="property: scale; from: 1 1 1; to: 1.3 1.3 1.3; dur: 800; loop: true; dir: alternate">
        </a-ring>

        <!-- ================= ПОТОК КРАХМАЛА (Из Точки 8 в Точку 5) ================= -->
        <!-- Белые частицы летят справа (X: 0.5) в центр (X: 0) -->
        <a-sphere position="0.5 0 0.01" radius="0.015" color="#ffffff"
                  animation="property: position; from: 0.5 0 0.01; to: 0 0 0.01; dur: 1800; loop: true; easing: linear">
        </a-sphere>
        <a-sphere position="0.5 0.03 0.01" radius="0.01" color="#f0f4f8"
                  animation="property: position; from: 0.5 0.03 0.01; to: 0 0 0.01; dur: 1400; loop: true; easing: linear; delay: 400">
        </a-sphere>
        <a-sphere position="0.5 -0.03 0.01" radius="0.012" color="#ffffff"
                  animation="property: position; from: 0.5 -0.03 0.01; to: 0 0 0.01; dur: 2000; loop: true; easing: linear; delay: 800">
        </a-sphere>

        <!-- ================= ПОТОК СИРОПА (Из Точки 5 в Точку 2) ================= -->
        <!-- Золотистые капли летят из центра (X: 0) налево (X: -0.5) -->
        <a-cylinder position="0 0 0.01" radius="0.018" height="0.06" color="#ffd700" rotation="0 0 90"
                    animation="property: position; from: 0 0 0.01; to: -0.5 0 0.01; dur: 2200; loop: true; easing: linear">
        </a-cylinder>
        <a-cylinder position="0 0.02 0.01" radius="0.012" height="0.05" color="#ffaa00" rotation="0 0 90"
                    animation="property: position; from: 0 0.02 0.01; to: -0.5 0.02 0.01; dur: 1800; loop: true; easing: linear; delay: 500">
        </a-cylinder>
        <a-cylinder position="0 -0.02 0.01" radius="0.015" height="0.055" color="#fff5cc" rotation="0 0 90"
                    animation="property: position; from: 0 -0.02 0.01; to: -0.5 -0.02 0.01; dur: 2500; loop: true; easing: linear; delay: 1000">
        </a-cylinder>

      

    </a-marker>

  </a-scene>

</body>
</html>
