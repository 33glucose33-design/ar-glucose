<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Лаборатория: Гидролиз</title>
  
  <!-- Подключаем официальные стабильные скрипты MindAR + A-Frame -->
  <script src="https://aframe.io"></script>
  <script src="https://jsdelivr.net"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    /* Плашка с подсказкой поверх камеры */
    #ar-overlay-info {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(11, 12, 16, 0.85);
      border: 1px solid #45f3ff;
      padding: 12px 24px;
      border-radius: 20px;
      color: #45f3ff;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      z-index: 9999;
      text-align: center;
      font-family: sans-serif;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="ar-overlay-info">Наведите камеру на плакат</div>

  <!-- 
    Инициализируем AR-сцену. Она сама автоматически вызовет камеру Chrome.
    Дополнительно отключаем встроенные экраны загрузки MindAR (uiLoading: no), 
    чтобы сайт открывался моментально.
  -->
  <a-scene mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiError: no; uiScanning: no;" 
           color-space="sRGB" 
           renderer="colorManagement: true, physicallyCorrectLights: true" 
           vr-mode-ui="enabled: false" 
           device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- 
      АР-ЯКОРЬ: привязан строго к вашему скомпилированному плакату targets.mind.
      Координаты внутри этой сущности рассчитываются от центра плаката (0 0 0).
      Границы вашего плаката по оси X распределены от -0.5 (лево, Точка 2) до 0.5 (право, Точка 8).
    -->
    
      
      <!-- Контейнер анимации, слегка приподнятый над плоскостью бумаги (Z: 0.02) -->
      
        
        <!-- ================= ТОЧКА 5: ГЕОМЕТРИЧЕСКИЙ ЦЕНТР (ЯДРО) ================= -->
        <!-- Плоское светящееся кольцо в центре реакции гидролиза -->
        <a-ring radius-inner="0" radius-outer="0.05" color="#ffd700" material="shader: flat; opacity: 0.9"
                animation="property: scale; from: 1 1 1; to: 1.3 1.3 1.3; dur: 900; loop: true; dir: alternate">
        </a-ring>

        <!-- ================= ПОТОК КРАХМАЛА (Из Точки 8 в Точку 5) ================= -->
        <!-- Белые непрерывные сферы летят с правого края плаката (X: 0.5) строго в центр (X: 0) -->
        <a-sphere position="0.5 0 0" radius="0.02" color="#ffffff" material="shader: flat; opacity: 0.8"
                  animation="property: position; from: 0.5 0 0; to: 0 0 0; dur: 1800; loop: true; easing: linear">
        </a-sphere>
        
        <a-sphere position="0.5 0.03 0" radius="0.014" color="#f0f4f8" material="shader: flat; opacity: 0.6"
                  animation="property: position; from: 0.5 0.03 0; to: 0 0 0; dur: 1400; loop: true; easing: linear; delay: 400">
        </a-sphere>

        <a-sphere position="0.5 -0.03 0" radius="0.016" color="#ffffff" material="shader: flat; opacity: 0.7"
                  animation="property: position; from: 0.5 -0.03 0; to: 0 0 0; dur: 2000; loop: true; easing: linear; delay: 800">
        </a-sphere>


        <!-- ================= ПОТОК ГЛЮКОЗНОГО СИРОПА (Из Точки 5 в Точку 2) ================= -->
        <!-- Золотистые вытянутые 3D-капли летят из центра плаката (X: 0) к его левому краю (X: -0.5) -->
        <a-cylinder position="0 0 0" radius="0.02" height="0.07" color="#ffd700" rotation="0 0 90" material="shader: flat; opacity: 0.9"
                    animation="property: position; from: 0 0 0; to: -0.5 0 0; dur: 2200; loop: true; easing: linear">
        </a-cylinder>

        <a-cylinder position="0 0.02 0" radius="0.014" height="0.05" color="#ffaa00" rotation="0 0 90" material="shader: flat; opacity: 0.7"
                    animation="property: position; from: 0 0.02 0; to: -0.5 0.02 0; dur: 1700; loop: true; easing: linear; delay: 500">
        </a-cylinder>

        <a-cylinder position="0 -0.02 0" radius="0.016" height="0.06" color="#fff5cc" rotation="0 0 90" material="shader: flat; opacity: 0.8"
                    animation="property: position; from: 0 -0.02 0; to: -0.5 -0.02 0; dur: 2400; loop: true; easing: linear; delay: 1000">
        </a-cylinder>

      
      
    
    
  </a-scene>

</body>
</html>
