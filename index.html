<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Лаборатория: Гидролиз крахмала</title>
  <style>
    /* Базовые настройки экрана */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }

    /* СВЕРХЛЕГКИЙ СТАРТОВЫЙ ЭКРАН */
    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0d0f18;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .btn-start {
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: #000;
      border: none;
      padding: 18px 40px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
    }

    /* ОКНО КАМЕРЫ (Стандартный HTML5 поток) */
    #webcam-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* ИНТЕРАКТИВНЫЙ ХОЛСТ С АНИМАЦИЕЙ (Привязан к пропорциям вашего плаката) */
    .ar-overlay-canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90vw;
      max-width: 600px;
      aspect-ratio: 4 / 3;
      z-index: 10;
      pointer-events: none;
      box-sizing: border-box;
    }

    /* ПОДСВЕТКА ЦЕНТРАЛЬНОЙ ТОЧКИ 5 (ЯДРО РЕАКЦИИ) */
    .transformation-core {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, #ffffff 10%, #ffd700 70%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 35px #ffd700, 0 0 10px #fff;
      animation: pulseCore 1s ease-in-out infinite alternate;
    }

    /* ЧАСТИЦЫ КРАХМАЛА (Движение по координатам вашей сетки: Точка 8 → Точка 5) */
    .starch-particle {
      position: absolute;
      top: 50%;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffffff;
      animation: flowStarch 2s linear infinite;
    }

    /* КАПЛИ СИРОПА (Движение по координатам вашей сетки: Точка 5 → Точка 2) */
    .syrup-drop {
      position: absolute;
      top: 50%;
      background: linear-gradient(to left, #ffd700, #ff8c00);
      border-radius: 50% 15% 15% 50% / 50% 50% 50% 50%;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
      animation: flowSyrup 2.2s linear infinite;
    }

    /* Создаем непрерывность за счет задержек анимации */
    .st1 { animation-delay: 0.0s; margin-top: -5px; width: 10px; height: 10px; }
    .st2 { animation-delay: 0.4s; margin-top: 5px;  width: 7px;  height: 7px; }
    .st3 { animation-delay: 0.8s; margin-top: -12px;width: 9px;  height: 9px; }
    .st4 { animation-delay: 1.2s; margin-top: 10px; width: 6px;  height: 6px; }

    .sy1 { animation-delay: 0.2s; margin-top: -6px; width: 20px; height: 12px; }
    .sy2 { animation-delay: 0.8s; margin-top: 4px;  width: 14px; height: 9px; }
    .sy3 { animation-delay: 1.4s; margin-top: -14px;width: 24px; height: 15px; }

    /* ================= ТРАЕКТОРИИ ДВИЖЕНИЯ ПО ТОЧКАМ СЕТКИ ================= */
    
    /* Крахмал: от правого края (Точка 8 = 94%) строго в центр (Точка 5 = 50%) */
    @keyframes flowStarch {
      0% { left: 94%; opacity: 0; transform: translate(0, -50%) scale(0.6); }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { left: 50%; opacity: 0.2; transform: translate(0, -50%) scale(1.1); }
    }

    /* Сироп: от центра (Точка 5 = 50%) строго к левому краю (Точка 2 = 6%) */
    @keyframes flowSyrup {
      0% { left: 50%; opacity: 0; transform: translate(0, -50%) scale(0.8); }
      15% { opacity: 1; transform: translate(0, -50%) scale(1.1); }
      85% { opacity: 1; }
      100% { left: 6%; opacity: 0; transform: translate(-20px, -50%) scale(0.5); }
    }

    @keyframes pulseCore {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Стартовый экран для активации медиа-потока пользователем -->
  <div id="start-screen">
    <button class="btn-start" id="btn-activate">Открыть AR Камеру</button>
  </div>

  <!-- Стандартный видеоплеер для камеры телефона -->
  <video id="webcam-video" autoplay playsinline muted></video>

  <!-- Слой анимации, наложенный поверх камеры телефона -->
  <div class="ar-overlay-canvas">
    
    <!-- Поток Крахмала: Из 8 в 5 -->
    <div class="starch-particle st1"></div>
    <div class="starch-particle st2"></div>
    <div class="starch-particle st3"></div>
    <div class="starch-particle st4"></div>

    <!-- Ядро гидролиза в точке 5 -->
    <div class="transformation-core"></div>

    <!-- Поток Сиропа: Из 5 в 2 -->
    <div class="syrup-drop sy1"></div>
    <div class="syrup-drop sy2"></div>
    <div class="syrup-drop sy3"></div>

  </div>

  <script>
    document.getElementById('btn-activate').addEventListener('click', async () => {
      const startScreen = document.getElementById('start-screen');
      const videoElement = document.getElementById('webcam-video');

      try {
        // Нативный вызов задней камеры смартфона (без сторонних библиотек)
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } }, // Запрашиваем основную (заднюю) камеру
          audio: false
        });
        
        videoElement.srcObject = stream;
        startScreen.style.display = 'none'; // Скрываем кнопку запуска
        
      } catch (err) {
        // Запасной вариант, если на ПК или некоторых AndroidfacingMode environment выдает ошибку
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });
          videoElement.srcObject = fallbackStream;
          startScreen.style.display = 'none';
        } catch (finalErr) {
          alert('Ошибка доступа: Пожалуйста, разрешите Хрому доступ к камере в настройках телефона.');
        }
      }
    });
  </script>

</body>
</html>
